<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>GA4 diagnostic test page</title>

    <!-- Google tag (gtag.js) — Google公式の標準スニペットをそのまま使用（改変なし） -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0TEWSSCD8B"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-0TEWSSCD8B');
    </script>
  </head>
  <body>
    <h1>GA4 diagnostic test page</h1>
    <p>
      このページは、React実装とは無関係にGoogle公式のgtag.js標準スニペットだけで
      GA4計測が届くかどうかを切り分けるための独立した静的HTMLです。
      Networkタブで <code>/g/collect</code> または <code>/td</code>
      へのリクエストが発生するか確認してください。
    </p>
    <button id="fire-event">カスタムイベントを送信 (test_click)</button>
    <pre id="log"></pre>

    <script>
      document.getElementById('fire-event').addEventListener('click', function () {
        gtag('event', 'test_click', { debug_marker: 'ga4-test-page' });
        document.getElementById('log').textContent =
          'gtag(event, test_click) を送信しました: ' + new Date().toISOString();
      });
    </script>
  </body>
</html>
